name: Sync Baoyu Design Plugins

on:
  schedule:
    # 每周一 00:00 UTC (北京时间 08:00) 自动检查并同步更新
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run sync script
        run: node integrations/baoyu-design/sync.mjs

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain integrations/baoyu-design) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add integrations/baoyu-design
            git commit -m "chore(integrations): sync baoyu-design plugins with upstream"
            git push
          else
            echo "No updates detected, working tree clean."
          fi
